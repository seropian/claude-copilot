name: macos-debug

on:
  push:
    branches: [worktree-macos-debug]

jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 --version && which python3 && sw_vers
      - run: python3 build.py
      - name: Run bundled shim directly
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, time, os, tempfile
          src = open("dist/claude-copilot.sh").read()
          shim = re.search(r"local shim='\n(.*?)\n'\n", src, re.S).group(1)
          d = tempfile.mkdtemp()
          pf = os.path.join(d, "state")
          p = subprocess.Popen([sys.executable, "-c", shim, "serve", "0", pf], stderr=subprocess.PIPE, stdout=subprocess.PIPE)
          t = time.time()
          while time.time() - t < 30 and not os.path.exists(pf) and p.poll() is None:
              time.sleep(0.2)
          print("elapsed", round(time.time() - t, 1), "exists", os.path.exists(pf), "rc", p.poll())
          if os.path.exists(pf): print(open(pf).read())
          p.terminate()
          out, err = p.communicate(timeout=10)
          print("STDOUT:", out.decode()); print("STDERR:", err.decode())
          PY
      - name: Launcher flow with bash -x on a tiny fake claude
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/state"
          printf '#!/bin/sh\necho fake claude "$@"\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          PATH="$RUNNER_TEMP/bin:$PATH" TMPDIR="$RUNNER_TEMP" COPILOT_STATE_DIR="$RUNNER_TEMP/state" HOME="$RUNNER_TEMP/home" \
            bash -c 'mkdir -p "$HOME/.local/share/claude-copilot"; echo x > "$HOME/.local/share/claude-copilot/github_token"; bash -x dist/claude-copilot.sh hi' 2>&1 | tail -60 || true
          echo "--- shim log"; cat "$RUNNER_TEMP/claude-copilot.log" 2>&1 | tail -40 || true
