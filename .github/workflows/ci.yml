name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 build.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash tests/test_shell.sh
      - run: python3 build.py --check
      - run: test ! -e claude-copilot.sh
      - run: test -x dist/claude-copilot.sh
